name: Sanitized usage feedback
description: Report a useful result, a missed workflow, or a confusing local behavior without uploading record material.
title: "[Feedback] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. AKT Reader is local and
        uncertainty-honest; this form is for a short, sanitized description of
        the behavior, not for archival material or a genealogical conclusion.

        Do not include scans, record text, names, addresses, descendant details,
        private source paths, credentials, tokens, or other personal data.
  - type: dropdown
    id: report_kind
    attributes:
      label: What are you reporting?
      options:
        - A result that was useful
        - A result that was unclear or misleading
        - A local command or validation failure
        - A documentation or setup gap
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: Describe the local workflow in general terms. Do not identify a person, record, scan, or archive source.
      placeholder: "Example: validate a locally prepared evidence object before review"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AKT Reader version
      description: Paste the output of `python -m aktreader --version` if available.
      placeholder: "aktreader-app 0.x.y"
  - type: input
    id: platform
    attributes:
      label: Local platform
      description: "For example: Windows 11 with Python 3.12."
  - type: textarea
    id: sanitized_behavior
    attributes:
      label: Sanitized message or behavior
      description: Include only the shortest general description, command name, or error wording needed to understand the problem. Do not paste a scan, record text, source path, token, or credential.
      placeholder: "Example: label-validate rejected a field after I set its observation state to PRESENT"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Keep this at the level of application behavior, not a reading of a historical record.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence check
      options:
        - label: I have not included scans, record text, names, addresses, descendant details, or other personal data.
          required: true
        - label: I have not included private source paths, credentials, tokens, or other secrets.
          required: true
        - label: I understand this report is not a request to upload archival material or make a genealogical conclusion.
          required: true
