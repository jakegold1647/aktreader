services:
  aktreader:
    build: .
    command: ["service-serve", "/data", "--container-listen", "--port", "8780"]
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - "./service-data:/data"
      - "./projects-to-import:/imports:ro"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8780/api/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
